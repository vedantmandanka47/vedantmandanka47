name: Pac-Man contribution grid

on:
  schedule:
    - cron: "0 */12 * * *"      # twice a day
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  push:
    branches: [main, master]
    paths:
      - "scripts/generate_pacman.py"
      - ".github/workflows/pacman.yml"

permissions:
  contents: write                # lets the job commit the refreshed SVGs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the grid from my real contributions
        run: python scripts/generate_pacman.py --user "${{ github.repository_owner }}" --out assets
        env:
          # Optional: add a classic token (scope: read:user) as the repo secret GH_TOKEN
          # to include private contributions. Falls back to the built-in token otherwise.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pacman-dark.svg assets/pacman-light.svg
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "chore: refresh Pac-Man grid"
          git push
